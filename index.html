<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なごや特売マップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,sans-serif;color:#172b23;background:#f6f8f5}header{padding:16px;background:#176c49;color:white}header h1{margin:0;font-size:22px}header small{opacity:.9}.wrap{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 78px)}aside{padding:16px;overflow:auto;max-height:calc(100vh - 110px)}#map{height:calc(100vh - 78px);min-height:450px}input,select,button{box-sizing:border-box;padding:11px;border:1px solid #cbd8cf;border-radius:9px;font:inherit}input,select{width:100%;margin:5px 0 12px}button{cursor:pointer;background:#176c49;color:white;border:0}.card{padding:12px;background:white;border:1px solid #dce5df;border-radius:12px;margin:10px 0}.muted{color:#66776e;font-size:13px}.price{font-weight:800;color:#b34a20}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}a{color:#176c49}#status{font-size:13px;margin:10px 0}.notice{background:#fff6db;padding:10px;border-radius:9px;font-size:13px}@media(max-width:700px){.wrap{display:flex;flex-direction:column}aside{max-height:none;order:2}#map{height:53vh;min-height:300px;order:1}}</style></head><body><header><h1>🛒 なごや特売マップ</h1><small>名古屋市の特売だけを探す</small></header><main class="wrap"><aside><div class="notice">実際に取得・確認された特売のみ表示します。データ未連携の店舗には架空の価格を表示しません。</div><label>商品・店舗検索<input id="search" placeholder="例：たまご、牛乳、ヤマナカ"></label><label>カテゴリ<select id="category"><option value="">すべて</option><option>食品</option><option>日用品</option><option>飲料</option></select></label><label>並べ替え<select id="sort"><option value="price">価格が安い順</option><option value="expiry">終了が近い順</option></select></label><div id="status">データ読み込み中…</div><div id="results"></div><div class="muted">価格比較は容量・単位が同じ商品のみ有効です。税込／税抜、会員条件も確認してください。</div></aside><div id="map" role="application" aria-label="名古屋市の特売地図"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([35.155,136.87],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);const layer=L.layerGroup().addTo(map);let stores=[],deals=[];const el=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function render(){layer.clearLayers();const q=el('search').value.trim().toLowerCase(),c=el('category').value;let rows=deals.filter(d=>d.valid_until>=today()&&(!c||d.category===c)&&[d.product,d.store_name].some(s=>String(s||'').toLowerCase().includes(q)));rows.sort((a,b)=>el('sort').value==='price'?a.price_yen-b.price_yen:a.valid_until.localeCompare(b.valid_until));el('status').textContent=`確認済み特売 ${rows.length}件 / 登録店舗 ${stores.length}店`;el('results').innerHTML=rows.length?rows.map(d=>`<article class="card"><div class="row"><strong>${safe(d.product)}</strong><span class="price">¥${Number(d.price_yen).toLocaleString()}</span></div><div>${safe(d.store_name)}</div><div class="muted">${safe(d.quantity||'')} · ${safe(d.tax_status||'税区分未確認')} · ${safe(d.valid_until)}まで</div><a href="${safe(d.source_url)}" target="_blank" rel="noopener noreferrer">情報元を確認 ↗</a></article>`).join(''):'<div class="card">該当する確認済み特売はありません。データ提供元との連携が必要です。</div>';const matched=new Set(rows.map(d=>d.store_id));stores.filter(s=>matched.has(s.id)).forEach(s=>{const sd=rows.filter(d=>d.store_id===s.id);L.marker([s.lat,s.lon]).addTo(layer).bindPopup(`<b>${safe(s.name)}</b><br>${sd.map(d=>`${safe(d.product)}：¥${Number(d.price_yen).toLocaleString()}`).join('<br>')}`)})}
Promise.all([fetch('./data/stores.json').then(r=>{if(!r.ok)throw Error('stores');return r.json()}),fetch('./data/deals.json').then(r=>{if(!r.ok)throw Error('deals');return r.json()})]).then(([s,d])=>{stores=s;const ids=new Set(s.map(x=>x.id));deals=d.filter(x=>ids.has(x.store_id)&&x.source_url?.startsWith('https://')&&/^\d{4}-\d{2}-\d{2}$/.test(x.valid_until)&&Number.isFinite(x.price_yen)&&x.price_yen>0);render()}).catch(()=>el('status').textContent='データの読み込みに失敗しました。Webサーバー経由で開いてください。');['search','category','sort'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',render));
</script></body></html>
